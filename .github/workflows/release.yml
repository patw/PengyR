# Build PengyR releases on version tags
#
# Produces and attaches to GitHub Release:
#   Linux:   .deb + AppImage
#   macOS:   .dmg
#   Windows: PengyR-Windows.zip (Qt + MSVC runtime DLLs bundled) + .msi installer
#
# Usage:
#   git tag v1.3.0 && git push --tags
#
# Manual test builds (no release is created or touched):
#   Actions tab -> Release -> "Run workflow", pick a branch and platform, or
#   gh workflow run release.yml --ref <branch> -f platform=windows
# The packages are attached to that run as downloadable artifacts instead.
#
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to build'
        type: choice
        default: windows
        options:
          - windows
          - linux
          - macos
          - all

permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb + AppImage)
    if: github.event_name == 'push' || contains(fromJSON('["linux","all"]'), inputs.platform)
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_RELEASE_LTO: "thin"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake patchelf qt6-base-dev qt6-svg-dev qt6-wayland libqt6waylandclient6 libgl-dev dpkg-dev \
            libssl-dev libfuse2 fuse3 qt6-declarative-dev-tools

      - name: Build .deb package
        run: ./build_deb.sh

      - name: Build AppImage
        run: |
          mkdir -p appimage/tools
          wget -q -P appimage/tools \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -P appimage/tools \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x appimage/tools/*.AppImage
          cd appimage && ./build.sh

      - name: Upload Release Assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pengy_*.deb
            PengyR-x86_64.AppImage
          fail_on_unmatched_files: false

      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: PengyR-Linux-${{ github.sha }}
          path: |
            pengy_*.deb
            PengyR-x86_64.AppImage
          retention-days: 7

  macos:
    name: macOS (DMG)
    if: github.event_name == 'push' || contains(fromJSON('["macos","all"]'), inputs.platform)
    runs-on: macos-latest
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          brew install qt@6 cmake

      - name: Build DMG
        run: ./build_macos.sh

      - name: Upload DMG
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: Pengy-macOS-*.dmg
          fail_on_unmatched_files: false

      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: PengyR-macOS-${{ github.sha }}
          path: Pengy-macOS-*.dmg
          retention-days: 7

  windows:
    name: Windows (Zip + MSI)
    if: github.event_name == 'push' || contains(fromJSON('["windows","all"]'), inputs.platform)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          @echo on
          echo Using Qt: %QT_ROOT_DIR%
          cargo build --release --target x86_64-pc-windows-msvc || exit /b 1
          mkdir gui\build_windows
          cd gui\build_windows
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%" -DRUST_TARGET_DIR="%CD%\..\..\target\x86_64-pc-windows-msvc\release" || exit /b 1
          cmake --build . || exit /b 1
          cd ..\..
          mkdir PengyR-Windows
          copy gui\build_windows\pengy.exe PengyR-Windows\ || exit /b 1
          cd PengyR-Windows
          windeployqt --no-compiler-runtime pengy.exe

      # Ship the MSVC runtime DLLs app-locally instead of windeployqt's
      # vc_redist.x64.exe, which zip users had to find and run themselves and
      # an MSI cannot run for them.
      - name: Bundle MSVC runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $crt = Get-ChildItem (Join-Path $env:VCToolsRedistDir 'x64') -Directory -Filter 'Microsoft.VC*.CRT' |
            Select-Object -First 1
          if (-not $crt) { throw "MSVC CRT redist not found under $env:VCToolsRedistDir" }
          Copy-Item (Join-Path $crt.FullName '*.dll') PengyR-Windows\
          Get-ChildItem PengyR-Windows\*.dll | Select-Object Name, Length | Format-Table

      # Runs on every build, release or test, before anything is packaged.
      - name: Smoke test
        shell: powershell
        run: .github\scripts\windows-smoke-test.ps1 -Exe PengyR-Windows\pengy.exe

      - name: Install WiX
        shell: powershell
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $env:PATH = "$tools;$env:PATH"
          $tools >> $env:GITHUB_PATH
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wix --version

      # The version comes from Cargo.toml (like the GUI's CMake), minus any
      # pre-release suffix, which MSI versions can't hold. A second MSI with
      # the build number bumped lets the next step test upgrading.
      - name: Build MSI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Select-String -Path Cargo.toml -Pattern '^version = "(\d+)\.(\d+)\.(\d+)' | Select-Object -First 1
          $g = $m.Matches[0].Groups
          $major = $g[1].Value; $minor = $g[2].Value; $patch = $g[3].Value
          $version = "$major.$minor.$patch"
          $label = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'dev' }
          msi\build.ps1 -AppDir PengyR-Windows -Version $version -Out "PengyR-Windows-$label.msi"
          msi\build.ps1 -AppDir PengyR-Windows -Version "$major.$minor.$([int]$patch + 1)" `
            -Out "$env:RUNNER_TEMP\PengyR-next.msi"
          "MSI_FILE=PengyR-Windows-$label.msi" >> $env:GITHUB_ENV

      - name: Test MSI install, upgrade, uninstall
        shell: powershell
        run: .github\scripts\windows-msi-test.ps1 -Msi $env:MSI_FILE -NextMsi "$env:RUNNER_TEMP\PengyR-next.msi"

      - name: Zip artifacts
        if: github.ref_type == 'tag'
        shell: powershell
        run: |
          Compress-Archive -Path PengyR-Windows\* -DestinationPath PengyR-Windows-${{ github.ref_name }}.zip

      - name: Upload Windows Zip + MSI
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PengyR-Windows-*.zip
            PengyR-Windows-*.msi
          fail_on_unmatched_files: false

      # Manual runs: the folder is uploaded as-is (GitHub zips it for
      # download), so there is no zip-inside-a-zip.
      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: PengyR-Windows-${{ github.sha }}
          path: PengyR-Windows/
          retention-days: 7

      - name: Upload test MSI
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: PengyR-Windows-MSI-${{ github.sha }}
          path: ${{ env.MSI_FILE }}
          retention-days: 7
