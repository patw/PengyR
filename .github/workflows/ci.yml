name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-check:
    name: Rust check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Cargo build data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Check Rust workspace
        run: cargo check --workspace

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    needs: rust-check
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Cache downloads, not compiled target/ci outputs: the previously shared
      # target cache made test jobs spend ~46 minutes rebuilding and time out.
      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-tests-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tests-deps-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Build and test Rust workspace
        run: cargo test --profile ci --workspace

  gui:
    name: Qt GUI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Cargo build data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/ci
          key: ${{ runner.os }}-cargo-gui-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gui-ci-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install GUI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libgl-dev libssl-dev pkg-config

      - name: Install Qt6
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.10.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      - name: Report Qt in use
        run: |
          echo "QT_ROOT_DIR=${QT_ROOT_DIR:-unset}"
          "${QT_ROOT_DIR}/bin/qmake" -query QT_VERSION 2>/dev/null || true

      - name: Build Rust core for GUI
        run: cargo build --profile ci -p pengy_core

      - name: Configure GUI
        run: cmake -S gui -B gui/build -DCMAKE_BUILD_TYPE=Release -DPENGY_BUILD_TESTS=ON -DRUST_TARGET_DIR=${{ github.workspace }}/target/ci

      - name: Build GUI
        run: cmake --build gui/build --parallel

      - name: Verify GUI
        run: ls -lh gui/build/pengy target/ci/libpengy_core.a

      # All six Qt test binaries were registered with add_test and nothing ever
      # ran them, so a reverted skill asset -- or any of the other regressions
      # they guard -- could ship unnoticed. The Build GUI step above already
      # built them (PENGY_BUILD_TESTS=ON); offscreen because the runners have no
      # display.
      - name: Qt tests
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir gui/build --output-on-failure
