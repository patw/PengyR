[workspace]
members = [".", "cli", "web"]

# Single source of truth for the version shared by pengy_core, pengy-cli, and
# pengy-web (see cli/Cargo.toml and web/Cargo.toml's `version.workspace = true`).
# Bump only here on release so About screens and --version flags never drift
# apart. The Qt GUI's version comes from a separate CMake-generated version.h
# (gui/CMakeLists.txt), which reads this same value at configure time.
[workspace.package]
version = "1.8.1"
edition = "2021"
authors = ["Pat Wendorf <dungeons@gmail.com>"]
repository = "https://github.com/patw/PengyR"

[package]
name = "pengy_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Pengy core library — config, chat, tools, LLM client"
repository.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

# Windows-specific: needed for static linking on MSVC
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = "0.48"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "http2"], default-features = false }

# Browser-impersonating HTTP client (TLS/JA3/JA4/HTTP2 fingerprinting)
primp = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Regex
regex = "1"

# XDG dirs
dirs = "5"

# UUID
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Misc
once_cell = "1"
futures-util = "0.3"
url = "2"
walkdir = "2"
scraper = "0.21"
rand = "0.8"
image = "0.25"
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = "thin"

# CI profile: prioritize fast compilation over optimized test binaries.
# This is intentionally much lighter than release: GitHub-hosted runners
# have limited CPU/time, and optimized builds of the full workspace can
# exceed the CI timeout before the GUI build even starts.
[profile.ci]
inherits = "release"
opt-level = 0
lto = false
incremental = true
codegen-units = 256
debug = 0
